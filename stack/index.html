<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- /stack/ is a redirect, not a page. Vercel serves a 307 from vercel.json
       before this file is ever reached; this is the fallback for any other host
       and for the moment before the hop lands.

       THE DESTINATION LIVES IN TWO PLACES. To change it, edit:
         1. vercel.json  -> the "/stack/?" route's Location header
         2. this file    -> the meta refresh, the canonical, and the <a> below

       The destination is the PUBLISHED notion.site URL, live and reachable
       logged out. Do not swap it back to a www.notion.so link: those require
       a Notion login. -->
  <meta http-equiv="refresh" content="0; url=https://sponge-script-fe4.notion.site/What-I-actually-build-with-3c84384dc0e08048928dc0a7084e0f2b">
  <link rel="canonical" href="https://sponge-script-fe4.notion.site/What-I-actually-build-with-3c84384dc0e08048928dc0a7084e0f2b">
  <meta name="robots" content="noindex, follow">
  <title>Redirecting&hellip;</title>
</head>
<body>
  <p>Redirecting to the stack. <a href="https://sponge-script-fe4.notion.site/What-I-actually-build-with-3c84384dc0e08048928dc0a7084e0f2b">Open it now</a>.</p>
  <script>location.replace("https://sponge-script-fe4.notion.site/What-I-actually-build-with-3c84384dc0e08048928dc0a7084e0f2b");</script>
</body>
