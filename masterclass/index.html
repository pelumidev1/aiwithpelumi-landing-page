<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- /masterclass/ is a redirect, not a page. Vercel serves a 307 from
       vercel.json before this file is ever reached; this is the fallback for
       any other host and for the moment before the hop lands.

       THE DESTINATION LIVES IN THREE PLACES. To change it, edit:
         1. vercel.json  -> the "/masterclass/?" route's Location header
         2. this file    -> the meta refresh, the canonical, and the <a> below
         3. script.js    -> MASTERCLASS_URL (the post-signup CTA)

       The destination is the Selar checkout page. The slug is spelled
       "buidwithaimasterclass" (no "l") on Selar; do not "correct" it. -->
  <meta http-equiv="refresh" content="0; url=https://selar.com/buidwithaimasterclass">
  <link rel="canonical" href="https://selar.com/buidwithaimasterclass">
  <meta name="robots" content="noindex, follow">
  <title>Redirecting&hellip;</title>
</head>
<body>
  <p>Redirecting to the masterclass. <a href="https://selar.com/buidwithaimasterclass">Open it now</a>.</p>
  <script>location.replace("https://selar.com/buidwithaimasterclass");</script>
</body>
</html>
