<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI with Pelumi — Application</title>

  <meta
    name="description"
    content="Apply to AI with Pelumi."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 24px 32px;
      border-bottom: 1px solid #eeeeee;
      background: #ffffff;
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
      color: #111111;
      text-decoration: none;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }

    .intro {
      text-align: center;
      margin-bottom: 30px;
    }

    .intro h1 {
      margin: 0 0 12px;
      font-size: 36px;
      line-height: 1.15;
      color: #111111;
    }

    .intro p {
      margin: 0 auto;
      max-width: 650px;
      color: #666666;
      font-size: 17px;
      line-height: 1.6;
    }

    .form-container {
      width: 100%;
      min-height: 800px;
    }

    .form-container iframe {
      display: block;
      width: 100%;
      min-height: 900px;
      border: 0;
    }

    footer {
      padding: 24px;
      text-align: center;
      border-top: 1px solid #eeeeee;
      color: #777777;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      header {
        padding: 20px;
      }

      main {
        padding: 30px 12px 40px;
      }

      .intro h1 {
        font-size: 28px;
      }

      .intro p {
        font-size: 15px;
      }

      .form-container iframe {
        min-height: 1000px;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <header>
      <a class="brand" href="https://aiwithpelumi.com">
        AI with Pelumi
      </a>
    </header>

    <main>
      <section class="intro">
        <h1>AI with Pelumi Application</h1>
        <p>
          Complete the form below to get started with AI with Pelumi.
        </p>
      </section>

      <div class="form-container">
        <iframe
          src="https://form.jotform.com/262275835227058"
          title="AI with Pelumi Onboarding Form"
          allow="fullscreen"
        >
        </iframe>
      </div>
    </main>

    <footer>
      © AI with Pelumi
    </footer>

  </div>
</body>
</html>
